<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,nofollow">
<title>徐胖虎资源社｜资源数据检查</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}.wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.back{color:#555;text-decoration:none;font-size:13px}.title{font-size:28px;font-weight:700}.sub{font-size:13px;color:#777;margin:7px 0 20px}.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 25px rgba(0,0,0,.06);margin-bottom:16px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #eee}.ok{color:#218a45}.bad{color:#b33}.muted{color:#888}.run{border:0;border-radius:13px;padding:10px 14px;background:#1d1d1f;color:#fff;cursor:pointer;font:inherit}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat{background:#fafafa;border-radius:14px;padding:14px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:#888}@media(max-width:720px){.summary{grid-template-columns:repeat(2,1fr)}.table{font-size:12px}}
</style>
<script src="/assets/js/admin-auth.js"></script><link rel="stylesheet" href="/assets/css/admin-v533.css">
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="/admin/index.html">← 返回后台</a><span>V5.3 数据检查</span></div>
  <div class="title">资源数据检查</div><p class="sub">只读检查六类资源数据，不会修改任何原始数据。</p>
  <div class="card"><button class="run" id="run">重新检查</button><div class="summary"><div class="stat"><b id="total">—</b><span>资源总数</span></div><div class="stat"><b id="ids">—</b><span>ID 重复</span></div><div class="stat"><b id="names">—</b><span>名称重复</span></div><div class="stat"><b id="urls">—</b><span>URL 缺失</span></div></div></div>
  <div class="card"><table class="table"><thead><tr><th>分类</th><th>数量</th><th>重复 ID</th><th>缺少名称</th><th>缺少 URL</th><th>状态</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="muted">正在读取数据…</td></tr></tbody></table></div>
</div>
<script src="/assets/js/data/ai.js"></script><script src="/assets/js/data/software.js"></script><script src="/assets/js/data/productivity.js"></script><script src="/assets/js/data/website.js"></script><script src="/assets/js/data/digital.js"></script><script src="/assets/js/data/solution.js"></script>
<script src="/assets/js/config/categories.js"></script><script src="/assets/js/config/resource-icons.js"></script><script src="/assets/js/config/tags.js"></script><script src="/assets/js/config/resource-validator.js"></script>
<script>
const groups=[['AI工具','aiResources'],['软件工具','softwareResources'],['效率工具','productivityResources'],['网页导航','websiteResources'],['数字资源','digitalResources'],['解决方案','solutionResources']];
function check(){let all=[],html='';for(const [label,key] of groups){const list=Array.isArray(window[key])?window[key]:[];all.push(...list);const result=window.XPHResourceValidator.validateAll(list);const ids=result.errors.filter(x=>x.includes('重复ID')).length;const names=result.errors.filter(x=>x.includes('重复名称')).length;const urls=list.filter(r=>!r.website&&!r.github).length;const bad=!result.valid||urls>0;html+=`<tr><td>${label}</td><td>${list.length}</td><td>${ids}</td><td>${names}</td><td>${urls}</td><td class="${bad?'bad':'ok'}">${bad?'发现问题':'正常'}</td></tr>`;}const globalResult=window.XPHResourceValidator.validateAll(all);const globalNameCounts=new Map();all.forEach(r=>globalNameCounts.set(r.name,(globalNameCounts.get(r.name)||0)+1));const duplicateNames=[...globalNameCounts].filter(([,n])=>n>1).length;document.getElementById('total').textContent=all.length;document.getElementById('ids').textContent=globalResult.errors.filter(x=>x.includes('重复ID')).length;document.getElementById('names').textContent=duplicateNames;document.getElementById('urls').textContent=all.filter(r=>!r.website&&!r.github).length;document.getElementById('rows').innerHTML=html;}document.getElementById('run').addEventListener('click',check);check();
</script>
</body>
</html>

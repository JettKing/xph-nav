<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>管理员验证</title></head><body><h2>管理员验证</h2><input id="pwd" type="password" placeholder="请输入密码"><button id="login">进入后台</button><script src="/assets/js/admin-auth.js"></script><script>
document.getElementById("login").onclick=async()=>{let h=await XPHAdminAuth.sha256(document.getElementById("pwd").value);if(h===XPHAdminAuth.ADMIN_HASH){sessionStorage.setItem("xph_admin_auth","1");location.href="/admin/index.html"}else alert("密码错误")};
</script></body></html>

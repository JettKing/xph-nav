<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-store">
<title>管理员验证</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif;background:#f5f5f7;color:#1d1d1f}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.login-card{width:min(100%,360px);padding:32px 28px;border-radius:26px;background:#fff;box-shadow:0 12px 35px rgba(0,0,0,.08);text-align:center}.login-card h1{font-size:22px;margin:0 0 24px;font-weight:700}.login-card input{display:block;width:100%;height:50px;padding:0 15px;border:1px solid #ddd;border-radius:16px;background:#fff;color:#1d1d1f;font-size:16px;outline:none;-webkit-appearance:none}.login-card input:focus{border-color:#3182f6;box-shadow:0 0 0 3px rgba(49,130,246,.12)}.login-card button{display:block;width:100%;height:50px;margin-top:16px;border:0;border-radius:18px;background:#3182f6;color:#fff;font:600 16px inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.login-card button:active{transform:scale(.98)}.login-card button:disabled{opacity:.65;cursor:default}.msg{min-height:20px;margin-top:12px;font-size:14px;color:#c33}</style>
</head>
<body>
<main class="login-card" aria-label="管理员验证">
<h1>管理员验证</h1>
<form id="loginForm"><input id="pwd" type="password" inputmode="text" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="请输入管理员密码">
<button id="login" type="submit">进入后台</button>
<div id="msg" class="msg" aria-live="polite"></div></form>
</main>
<script src="/assets/js/admin-login.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>管理员验证</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f5;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}
.login-card{width:min(90%,360px);padding:32px;border-radius:16px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.08);text-align:center}
h2{margin:0 0 24px}
input{width:100%;height:44px;padding:0 14px;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{width:100%;height:48px;margin-top:18px;border:0;border-radius:18px;cursor:pointer;background:#3182f6;color:#fff;font-size:16px;font-weight:500;transition:.2s}button:active{transform:scale(.98)}
#msg{min-height:20px;margin-top:12px;font-size:14px}
</style>
</head>
<body>
<div class="login-card">
<h2>管理员验证</h2>
<input id="pwd" type="password" placeholder="请输入密码">
<button id="login">进入后台</button>
<div id="msg"></div>
</div>
<script src="/assets/js/admin-auth.js"></script>
<script>
document.getElementById("login").onclick=async()=>{
 const btn=document.getElementById("login");
 const msg=document.getElementById("msg");
 btn.disabled=true;
 const h=await XPHAdminAuth.sha256(document.getElementById("pwd").value);
 if(h===XPHAdminAuth.ADMIN_HASH){
  sessionStorage.setItem("xph_admin_auth","1");
  location.href="/admin/index.html";
 }else{
  msg.textContent="密码错误";
  btn.disabled=false;
 }
};
document.getElementById("pwd").addEventListener("keydown",e=>{
 if(e.key==="Enter") document.getElementById("login").click();
});
</script>
</body>
</html>
